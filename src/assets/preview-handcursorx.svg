<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet">
  <!--
    handcursorx preview — flat block-colour rendering of the reference
    photo. Only the hand landmarks + skeleton lines and a classic mouse
    cursor near the index fingertip are drawn on a dark neon backdrop.
  -->
  <!-- soft light-blue background — deliberately off-theme so the hand
       reads as a diagnostic overlay, not part of the site chrome. -->
  <rect width="800" height="400" fill="#cfe6f5"/>

  <!--
    Hand skeleton (right hand, palm facing camera, fingers pointing up).
    Landmark indices follow MediaPipe: 0=wrist,
    thumb 1-4, index 5-8, middle 9-12, ring 13-16, pinky 17-20.
    Coordinates chosen so the hand sits centred with the index tip
    pointing to the mouse cursor.
  -->
  <g stroke="#2ecc40" stroke-width="3" stroke-linecap="round" fill="none">
    <!-- palm base connections -->
    <line x1="400" y1="360" x2="335" y2="305"/>  <!-- 0-1 -->
    <line x1="400" y1="360" x2="365" y2="255"/>  <!-- 0-5 -->
    <line x1="400" y1="360" x2="410" y2="250"/>  <!-- 0-9 -->
    <line x1="400" y1="360" x2="455" y2="255"/>  <!-- 0-13 -->
    <line x1="400" y1="360" x2="495" y2="275"/>  <!-- 0-17 -->
    <!-- knuckle bridge across the palm -->
    <line x1="365" y1="255" x2="410" y2="250"/>
    <line x1="410" y1="250" x2="455" y2="255"/>
    <line x1="455" y1="255" x2="495" y2="275"/>

    <!-- thumb chain 1-2-3-4 -->
    <line x1="335" y1="305" x2="295" y2="275"/>
    <line x1="295" y1="275" x2="260" y2="250"/>
    <line x1="260" y1="250" x2="235" y2="230"/>

    <!-- index chain 5-6-7-8 -->
    <line x1="365" y1="255" x2="350" y2="205"/>
    <line x1="350" y1="205" x2="340" y2="160"/>
    <line x1="340" y1="160" x2="330" y2="120"/>

    <!-- middle chain 9-10-11-12 -->
    <line x1="410" y1="250" x2="410" y2="195"/>
    <line x1="410" y1="195" x2="410" y2="145"/>
    <line x1="410" y1="145" x2="410" y2="105"/>

    <!-- ring chain 13-14-15-16 -->
    <line x1="455" y1="255" x2="465" y2="205"/>
    <line x1="465" y1="205" x2="475" y2="165"/>
    <line x1="475" y1="165" x2="485" y2="130"/>

    <!-- pinky chain 17-18-19-20 -->
    <line x1="495" y1="275" x2="515" y2="240"/>
    <line x1="515" y1="240" x2="530" y2="210"/>
    <line x1="530" y1="210" x2="545" y2="185"/>
  </g>

  <!-- landmark dots (flat red) -->
  <g fill="#e60023">
    <circle cx="400" cy="360" r="7"/>
    <!-- thumb -->
    <circle cx="335" cy="305" r="5"/>
    <circle cx="295" cy="275" r="5"/>
    <circle cx="260" cy="250" r="5"/>
    <circle cx="235" cy="230" r="5"/>
    <!-- index -->
    <circle cx="365" cy="255" r="5"/>
    <circle cx="350" cy="205" r="5"/>
    <circle cx="340" cy="160" r="5"/>
    <!-- middle -->
    <circle cx="410" cy="250" r="5"/>
    <circle cx="410" cy="195" r="5"/>
    <circle cx="410" cy="145" r="5"/>
    <circle cx="410" cy="105" r="5"/>
    <!-- ring -->
    <circle cx="455" cy="255" r="5"/>
    <circle cx="465" cy="205" r="5"/>
    <circle cx="475" cy="165" r="5"/>
    <circle cx="485" cy="130" r="5"/>
    <!-- pinky -->
    <circle cx="495" cy="275" r="5"/>
    <circle cx="515" cy="240" r="5"/>
    <circle cx="530" cy="210" r="5"/>
    <circle cx="545" cy="185" r="5"/>
  </g>

  <!-- index tip landmark 8 — highlighted (the pointer origin) -->
  <circle cx="330" cy="120" r="9" fill="#e60023" stroke="#ffffff" stroke-width="2"/>

  <!--
    Classic mouse-arrow cursor sitting just above the index tip.
    Polygon points draw the traditional arrow silhouette.
  -->
  <g transform="translate(290 78)">
    <polygon
      points="0,0 0,32 8,25 13,36 19,33 14,22 24,22"
      fill="#ffffff"
      stroke="#111111"
      stroke-width="2"
      stroke-linejoin="round"/>
  </g>
</svg>

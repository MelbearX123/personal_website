<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Pastel iridescence, echoing the hero disc. -->
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BFD2FF"/>
      <stop offset="0.3" stop-color="#F3E8FF"/>
      <stop offset="0.55" stop-color="#C9F1FF"/>
      <stop offset="0.8" stop-color="#D9CCFF"/>
      <stop offset="1" stop-color="#AFC4F5"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0.36" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="0.64" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <circle cx="16" cy="16" r="15" fill="url(#foil)"/>
  <circle cx="16" cy="16" r="15" fill="url(#sheen)"/>
  <circle cx="16" cy="16" r="11.5" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="0.6"/>
  <circle cx="16" cy="16" r="15" fill="none" stroke="#0B1B36" stroke-opacity="0.3"/>
  <circle cx="16" cy="16" r="5.5" fill="#EEF4FC" stroke="#0B1B36" stroke-opacity="0.18" stroke-width="0.8"/>
  <circle cx="16" cy="16" r="1.9" fill="#0B1B36" fill-opacity="0.75"/>
</svg>
